<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PartsPro — Appointments</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css"
    />
    <style>
      :root {
        --pp-green: #10b981;
        --pp-amber: #f59e0b;
        --pp-cream: #faf8f5;
        --pp-border: #e5dfd3;
        --pp-text: #2c2416;
        --pp-muted: #8b7d6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--pp-cream);
        color: var(--pp-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
      }
      .cust-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: rgba(250, 248, 245, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--pp-border);
        display: flex;
        align-items: center;
        padding: 0 32px;
        z-index: 1000;
      }
      .nav-left {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-right: auto;
      }
      .nav-brand-dot {
        width: 8px;
        height: 8px;
        background: var(--pp-green);
        border-radius: 1px;
      }
      .nav-brand-text {
        font-size: 14px;
        font-weight: 600;
        color: var(--pp-text);
        text-decoration: none;
      }
      .nav-center {
        display: flex;
        gap: 32px;
        flex: 1;
        justify-content: center;
      }
      .nav-link {
        font-size: 13px;
        font-weight: 500;
        color: var(--pp-muted);
        text-decoration: none;
        padding-bottom: 2px;
        border-bottom: 2px solid transparent;
      }
      .nav-link:hover,
      .nav-link.active {
        color: var(--pp-text);
      }
      .nav-link.active {
        border-bottom-color: var(--pp-green);
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: auto;
      }
      .nav-avatar {
        width: 32px;
        height: 32px;
        background: #e5dfd3;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--pp-green);
      }
      .nav-user-info {
        display: flex;
        flex-direction: column;
        font-size: 11px;
      }
      .nav-user-name {
        font-weight: 600;
      }
      .nav-user-role {
        color: var(--pp-muted);
      }
      .nav-logout {
        background: none;
        border: 0;
        color: var(--pp-muted);
        font-size: 16px;
        cursor: pointer;
      }
      .page {
        margin-top: 64px;
        padding: 32px;
        min-height: calc(100vh - 64px);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 18px;
      }
      .header h1 {
        font-size: 32px;
        margin: 0 0 4px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      .header p {
        margin: 0;
        color: var(--pp-muted);
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--pp-border);
        border-radius: 10px;
        padding: 22px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--pp-border);
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--pp-muted);
        font-weight: 700;
        margin-bottom: 6px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #d4cabe;
        border-radius: 6px;
        background: #fff;
        color: var(--pp-text);
        padding: 10px 12px;
        font-size: 13px;
        font-family: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--pp-green);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
      }
      .btn {
        border: 1px solid var(--pp-green);
        background: var(--pp-green);
        color: #fff;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.secondary {
        background: #fff;
        color: var(--pp-text);
        border-color: #d4cabe;
      }
      .appointment {
        border: 1px solid var(--pp-border);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 12px;
        background: #fff;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .name {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
      }
      .meta {
        font-size: 12px;
        color: var(--pp-muted);
        margin: 4px 0 0;
      }
      .badge {
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
      }
      .Pending {
        background: rgba(245, 158, 11, 0.12);
        color: #d97706;
      }
      .Confirmed {
        background: rgba(59, 130, 246, 0.12);
        color: #2563eb;
      }
      .Completed {
        background: rgba(16, 185, 129, 0.12);
        color: #059669;
      }
      .Cancelled {
        background: rgba(239, 68, 68, 0.12);
        color: #dc2626;
      }
      .empty {
        color: var(--pp-muted);
        text-align: center;
        padding: 28px;
      }
      .alert {
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        margin-bottom: 14px;
      }
      .success {
        background: rgba(16, 185, 129, 0.1);
        color: #047857;
        border: 1px solid rgba(16, 185, 129, 0.25);
      }
      .error {
        background: rgba(239, 68, 68, 0.1);
        color: #b91c1c;
        border: 1px solid rgba(239, 68, 68, 0.25);
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .nav-center {
          display: none;
        }
        .page {
          padding: 16px;
        }
        .cust-nav {
          padding: 0 16px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="cust-nav">
      <div class="nav-left">
        <div class="nav-brand-dot"></div>
        <a href="../index.html" class="nav-brand-text">Parts Pro</a>
      </div>
      <div class="nav-center">
        <a href="dashboard.html" class="nav-link">Dashboard</a
        ><a href="appointments.html" class="nav-link active">Appointments</a
        ><a href="history.html" class="nav-link">History</a
        ><a href="part-requests.html" class="nav-link">Part Requests</a
        ><a href="profile.html" class="nav-link">Profile</a>
      </div>
      <div class="nav-right">
        <div class="nav-avatar" id="nav-avatar">ME</div>
        <div class="nav-user-info">
          <div class="nav-user-name" id="nav-user-name">Customer</div>
          <div class="nav-user-role">Customer</div>
        </div>
        <button class="nav-logout" id="logout-btn">⤴</button>
      </div>
    </nav>
    <div class="page">
      <div class="container">
        <div class="header">
          <div>
            <h1>📅 Appointments</h1>
            <p>Book and view your vehicle service appointments</p>
          </div>
        </div>
        <div class="grid">
          <div class="card">
            <h2 class="card-title">Book New Appointment</h2>
            <div id="alert-box"></div>
            <form id="appointment-form">
              <div class="form-group">
                <label>Vehicle</label
                ><select id="vehicle-id" required>
                  <option value="">Select vehicle...</option>
                </select>
              </div>
              <div class="form-group">
                <label>Service Type</label
                ><select id="service-type" required>
                  <option value="General Service">General Service</option>
                  <option value="Oil Change">Oil Change</option>
                  <option value="Brake Inspection">Brake Inspection</option>
                  <option value="Engine Check">Engine Check</option>
                  <option value="Tyre / Suspension Check">
                    Tyre / Suspension Check
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label>Date and Time</label
                ><input type="datetime-local" id="appointment-date" required />
              </div>
              <div class="form-group">
                <label>Notes</label
                ><textarea
                  id="notes"
                  rows="4"
                  placeholder="Describe the issue or request..."
                ></textarea>
              </div>
              <button class="btn" type="submit">Book Appointment</button>
            </form>
          </div>
          <div class="card">
            <h2 class="card-title">My Appointments</h2>
            <div id="appointments-list">
              <div class="empty">Loading appointments...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../shared/axios-config.js"></script>
    <script src="../shared/auth-guard.js"></script>
    <script src="../shared/role-guard.js"></script>
    <script src="../shared/auth-handler.js"></script>
    <script>
      RoleGuard.requireRole("Customer");
      let customerId = null;
      document.addEventListener("DOMContentLoaded", async () => {
        setupNav();
        customerId = await resolveCustomerId();
        if (!customerId) {
          showAlert(
            "Unable to resolve customer profile. Please log in again.",
            "error",
          );
          return;
        }
        await loadVehicles();
        await loadAppointments();
        document
          .getElementById("appointment-form")
          .addEventListener("submit", submitAppointment);
      });
      function setupNav() {
        const name = localStorage.getItem("userFullName") || "Customer";
        document.getElementById("nav-user-name").textContent = name;
        document.getElementById("nav-avatar").textContent = name
          .split(" ")
          .map((n) => n[0])
          .join("")
          .toUpperCase()
          .slice(0, 2);
        document
          .getElementById("logout-btn")
          .addEventListener("click", () => AuthHandler.logout());
        const min = new Date(Date.now() + 60 * 60 * 1000);
        document.getElementById("appointment-date").min = min
          .toISOString()
          .slice(0, 16);
      }
      async function resolveCustomerId() {
        const cached = localStorage.getItem("customerId");
        if (cached) return cached;
        return null;
      }
      async function loadVehicles() {
        try {
          const res = await api.getCustomerVehicles(customerId);
          const select = document.getElementById("vehicle-id");
          select.innerHTML = '<option value="">Select vehicle...</option>';
          (res.data || []).forEach((v) => {
            select.innerHTML += `<option value="${v.id}">${esc(v.model)} (${esc(v.plateNumber)})</option>`;
          });
        } catch (e) {
          showAlert(
            "Failed to load vehicles. Add a vehicle in profile first.",
            "error",
          );
        }
      }
      async function loadAppointments() {
        const box = document.getElementById("appointments-list");
        try {
          const res = await api.getCustomerAppointments(customerId);
          const items = res.data || [];
          if (items.length === 0) {
            box.innerHTML = '<div class="empty">No appointments yet.</div>';
            return;
          }
          box.innerHTML = items
            .map(
              (a) =>
                `<div class="appointment"><div><p class="name">${esc(a.serviceType)}</p><p class="meta">${formatDateTime(a.appointmentDate)} · ${esc(a.vehicleModel || "Vehicle")} ${a.plateNumber ? "(" + esc(a.plateNumber) + ")" : ""}</p><p class="meta">${esc(a.notes || "No notes")}</p></div><span class="badge ${esc(a.status)}">${esc(a.status)}</span></div>`,
            )
            .join("");
        } catch (e) {
          box.innerHTML =
            '<div class="empty">Failed to load appointments.</div>';
        }
      }
      async function submitAppointment(e) {
        e.preventDefault();
        const payload = {
          customerId: Number(customerId),
          vehicleId: Number(document.getElementById("vehicle-id").value),
          serviceType: document.getElementById("service-type").value,
          appointmentDate: new Date(
            document.getElementById("appointment-date").value,
          ).toISOString(),
          notes: document.getElementById("notes").value,
        };
        try {
          await api.createCustomerAppointment(customerId, payload);
          showAlert("Appointment booked successfully.", "success");
          e.target.reset();
          await loadAppointments();
        } catch (err) {
          showAlert(
            err.response?.data?.message ||
              err.response?.data?.title ||
              "Failed to book appointment.",
            "error",
          );
        }
      }
      function showAlert(msg, type) {
        document.getElementById("alert-box").innerHTML =
          `<div class="alert ${type}">${esc(msg)}</div>`;
        setTimeout(
          () => (document.getElementById("alert-box").innerHTML = ""),
          3500,
        );
      }
      function formatDateTime(d) {
        if (!d) return "N/A";
        return new Date(d).toLocaleString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function esc(v) {
        return String(v ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
