<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartsPro — Reports</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <style>
    :root {
      --pp-amber: #F59E0B;
      --pp-navy: #0B1121;
      --pp-navy2: #0F172A;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--pp-navy);
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* NAVIGATION BAR */
    .admin-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(11, 17, 33, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1E293B;
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 1000;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      margin-right: auto;
    }

    .nav-brand-dot {
      width: 8px; height: 8px;
      background: var(--pp-amber);
      border-radius: 1px;
    }

    .nav-brand-text {
      font-size: 14px;
      font-weight: 600;
      color: #E2E8F0;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 32px;
      flex: 1;
      justify-content: center;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: #64748B;
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    .nav-link:hover { color: #E2E8F0; }

    .nav-link.active {
      color: #E2E8F0;
      border-bottom-color: var(--pp-amber);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .nav-avatar {
      width: 32px; height: 32px;
      background: #0F172A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--pp-amber);
    }

    .nav-user-info { display: flex; flex-direction: column; font-size: 11px; }
    .nav-user-name { color: #E2E8F0; font-weight: 600; }
    .nav-user-role { color: #64748B; }

    .nav-logout {
      background: none; border: none;
      color: #64748B; cursor: pointer;
      font-size: 16px; padding: 4px;
      transition: color 0.3s;
    }
    .nav-logout:hover { color: #FF6B6B; }

    /* PAGE */
    .admin-page {
      margin-top: 64px;
      padding: 32px;
      min-height: calc(100vh - 64px);
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* HEADER */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
    }

    .header-left h1 {
      font-size: 32px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -1px;
      margin: 0 0 4px 0;
    }

    .header-left p {
      font-size: 14px;
      color: #64748B;
      margin: 0;
    }

    /* TABS */
    .tab-container {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #1E293B;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #64748B;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #E2E8F0;
    }

    .tab-btn.active {
      color: #E2E8F0;
      border-bottom-color: var(--pp-amber);
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      white-space: nowrap;
    }

    input[type="date"],
    input[type="number"],
    select {
      background: #0F172A;
      border: 1px solid #1E293B;
      color: #E2E8F0;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: all 0.3s;
    }

    input[type="date"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--pp-amber);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
    }

    .btn-action {
      background: var(--pp-amber);
      border: 1px solid var(--pp-amber);
      color: #0B1121;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-action:hover {
      background: #D97706;
      border-color: #D97706;
    }

    .btn-action.secondary {
      background: transparent;
      border-color: #1E293B;
      color: #E2E8F0;
    }

    .btn-action.secondary:hover {
      border-color: #475569;
      background: rgba(71, 85, 105, 0.1);
    }

    /* CONTENT */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    .tab-content.active {
      display: block;
    }

    /* KPI GRID */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 20px;
    }

    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748B;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    .kpi-helper {
      font-size: 11px;
      color: #64748B;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      overflow: hidden;
    }

    thead {
      background: #1A2332;
      border-bottom: 1px solid #1E293B;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #1E293B;
      font-size: 13px;
    }

    tbody tr:hover {
      background: #1A2332;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tfoot tr {
      background: #1A2332;
      font-weight: 600;
    }

    /* SUMMARY BOX */
    .summary-box {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 20px;
      margin-top: 24px;
    }

    .summary-box h3 {
      font-size: 14px;
      font-weight: 600;
      color: #E2E8F0;
      margin: 0 0 16px 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1E293B;
      font-size: 13px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #94A3B8;
    }

    .summary-value {
      font-weight: 600;
      color: #F59E0B;
      font-family: 'Monaco', monospace;
    }

    /* NO DATA */
    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #64748B;
      font-size: 14px;
    }

    /* EMPTY STATE */
    .empty-state {
      background: #0F172A;
      border: 1px dashed #1E293B;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      color: #64748B;
    }

    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .tab-container { flex-wrap: wrap; }
    }

    @media (max-width: 768px) {
      .admin-page { padding: 16px; }
      .admin-nav { padding: 0 16px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .nav-center { display: none; }
      .controls { flex-direction: column; align-items: stretch; }
      .control-group { flex-direction: column; }
      table { font-size: 12px; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <nav class="admin-nav">
    <div class="nav-left">
      <div class="nav-brand-dot"></div>
      <a href="../index.html" class="nav-brand-text">Parts Pro</a>
    </div>

    <div class="nav-center">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="parts.html" class="nav-link">Parts</a>
      <a href="vendors.html" class="nav-link">Vendors</a>
      <a href="staff.html" class="nav-link">Staff</a>
      <a href="purchase.html" class="nav-link">Purchases</a>
      <a href="reports.html" class="nav-link active">Reports</a>
    </div>

    <div class="nav-right">
      <div class="nav-avatar" id="nav-avatar">AD</div>
      <div class="nav-user-info">
        <div class="nav-user-name" id="nav-user-name">Admin</div>
        <div class="nav-user-role">Administrator</div>
      </div>
      <button class="nav-logout" id="logout-btn" title="Logout">⤴</button>
    </div>
  </nav>

  <div class="admin-page">
    <div class="admin-container">

      <div class="page-header">
        <div class="header-left">
          <h1>Reports</h1>
          <p>Financial analytics and business insights</p>
        </div>
      </div>

      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('financial')">Financial Report</button>
        <button class="tab-btn" onclick="switchTab('profitloss')">P&L Statement</button>
        <button class="tab-btn" onclick="switchTab('monthlysales')">Monthly Sales</button>
        <button class="tab-btn" onclick="switchTab('topselling')">Top Selling</button>
        <button class="tab-btn" onclick="switchTab('inventory')">Inventory</button>
      </div>

      <div id="financial" class="tab-content active">
        <div class="controls">
          <div class="control-group">
            <label for="fin-start">Start Date:</label>
            <input type="date" id="fin-start">
          </div>
          <div class="control-group">
            <label for="fin-end">End Date:</label>
            <input type="date" id="fin-end">
          </div>
          <button class="btn-action" onclick="generateFinancialReport()">Generate Report</button>
          <button class="btn-action" style="background: #10B981;" onclick="downloadFinancialReport()" title="Download as CSV">⬇ Download</button>
        </div>
        <div id="financial-content"></div>
      </div>

      <div id="profitloss" class="tab-content">
        <div class="controls">
          <div class="control-group">
            <label for="pl-start">Start Date:</label>
            <input type="date" id="pl-start">
          </div>
          <div class="control-group">
            <label for="pl-end">End Date:</label>
            <input type="date" id="pl-end">
          </div>
          <button class="btn-action" onclick="generateProfitLoss()">Generate P&L</button>
          <button class="btn-action" style="background: #10B981;" onclick="downloadProfitLoss()" title="Download as CSV">⬇ Download</button>
        </div>
        <div id="profitloss-content"></div>
      </div>

      <div id="monthlysales" class="tab-content">
        <div class="controls">
          <div class="control-group">
            <label for="ms-year">Year:</label>
            <input type="number" id="ms-year" min="2000" max="2099">
          </div>
          <button class="btn-action" onclick="generateMonthlySales()">Generate Report</button>
          <button class="btn-action" style="background: #10B981;" onclick="downloadMonthlySales()" title="Download as CSV">⬇ Download</button>
        </div>
        <div id="monthlysales-content"></div>
      </div>

      <div id="topselling" class="tab-content">
        <div class="controls">
          <div class="control-group">
            <label for="ts-limit">Top:</label>
            <input type="number" id="ts-limit" value="10" min="1" max="100">
          </div>
          <button class="btn-action" onclick="generateTopSelling()">Generate Report</button>
          <button class="btn-action" style="background: #10B981;" onclick="downloadTopSelling()" title="Download as CSV">⬇ Download</button>
        </div>
        <div id="topselling-content"></div>
      </div>

      <div id="inventory" class="tab-content">
        <div class="controls">
          <button class="btn-action" onclick="generateInventorySummary()">Refresh Inventory</button>
          <button class="btn-action" style="background: #10B981;" onclick="downloadInventory()" title="Download as CSV">⬇ Download</button>
        </div>
        <div id="inventory-content"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="../shared/axios-config.js"></script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/role-guard.js"></script>
  <script src="../shared/auth-handler.js"></script>

  <script>
    RoleGuard.requireRole('Admin');

    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('userFullName') || 'Admin';
      const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('nav-avatar').textContent = initials;
      document.getElementById('nav-user-name').textContent = name;

      document.getElementById('logout-btn').addEventListener('click', () => {
        AuthHandler.logout();
      });

      initializeDateInputs();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      const selectedBtn = Array.from(document.querySelectorAll('.tab-btn'))
        .find(btn => btn.getAttribute('onclick')?.includes(`'${tabName}'`));
      if (selectedBtn) selectedBtn.classList.add('active');
    }

    function initializeDateInputs() {
      const endDate = new Date();
      const startDate = new Date(endDate.getTime() - (30 * 24 * 60 * 60 * 1000));

      document.getElementById('fin-start').valueAsDate = startDate;
      document.getElementById('fin-end').valueAsDate = endDate;
      document.getElementById('pl-start').valueAsDate = startDate;
      document.getElementById('pl-end').valueAsDate = endDate;
      document.getElementById('ms-year').value = new Date().getFullYear();
    }

    function getValue(obj, ...keys) {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null) return obj[key];
      }
      return undefined;
    }

    function asArray(payload) {
      if (Array.isArray(payload)) return payload;
      return payload?.items || payload?.data || payload?.results || payload?.value || [];
    }

    function numberValue(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function money(value) {
      return 'Rs.' + numberValue(value).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function percent(value) {
      return numberValue(value).toFixed(2) + '%';
    }

    function backendError(e, fallback) {
      console.error(fallback, e);
      const data = e.response?.data;
      if (typeof data === 'string') return data;
      return data?.title || data?.message || data?.error || e.message || fallback;
    }

    async function generateFinancialReport() {
      const startDate = document.getElementById('fin-start').value;
      const endDate = document.getElementById('fin-end').value;

      if (!startDate || !endDate) {
        showError('financial-content', 'Please select both dates');
        return;
      }

      try {
        const response = await api.getFinancialReport(startDate, endDate);
        displayFinancialReport(response.data, 'financial-content', startDate, endDate, 'Financial Summary');
      } catch (e) {
        showError('financial-content', backendError(e, 'Failed to generate financial report'));
      }
    }

    function displayFinancialReport(data, containerId = 'financial-content', startDate = '', endDate = '', title = 'Financial Summary') {
      data = data || {};

      const totalSalesRevenue = getValue(data, 'totalSalesRevenue', 'TotalSalesRevenue');
      const totalSalesCount = getValue(data, 'totalSalesCount', 'TotalSalesCount');
      const totalPurchaseCost = getValue(data, 'totalPurchaseCost', 'TotalPurchaseCost');
      const totalPurchasesCount = getValue(data, 'totalPurchasesCount', 'TotalPurchasesCount');
      const grossProfit = getValue(data, 'grossProfit', 'GrossProfit');
      const grossProfitMargin = getValue(data, 'grossProfitMargin', 'GrossProfitMargin');
      const netProfit = getValue(data, 'netProfit', 'NetProfit');
      const averageSaleAmount = getValue(data, 'averageSaleAmount', 'AverageSaleAmount', 'averageOrderValue', 'AverageOrderValue');
      const totalInventoryValue = getValue(data, 'totalInventoryValue', 'TotalInventoryValue');
      const activeCustomers = getValue(data, 'activeCustomers', 'ActiveCustomers');
      const totalCustomers = getValue(data, 'totalCustomers', 'TotalCustomers');
      const totalSalesDiscounts = getValue(data, 'totalSalesDiscounts', 'TotalSalesDiscounts');
      const costOfGoodsSold = getValue(data, 'costOfGoodsSold', 'CostOfGoodsSold');

      const html = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Total Sales Revenue</div>
            <div class="kpi-value">${money(totalSalesRevenue)}</div>
            <div class="kpi-helper">${numberValue(totalSalesCount)} transactions</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Purchase Invoice Total</div>
            <div class="kpi-value">${money(totalPurchaseCost)}</div>
            <div class="kpi-helper">${numberValue(totalPurchasesCount)} purchases</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Gross Profit</div>
            <div class="kpi-value">${money(grossProfit)}</div>
            <div class="kpi-helper">${percent(grossProfitMargin)} margin</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Net Profit</div>
            <div class="kpi-value">${money(netProfit)}</div>
            <div class="kpi-helper">After adjustments</div>
          </div>
        </div>

        <div class="summary-box">
          <h3>${title}</h3>
          <div class="summary-row">
            <span class="summary-label">Report Period</span>
            <span class="summary-value">${startDate} to ${endDate}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Cost of Goods Sold</span>
            <span class="summary-value">${money(costOfGoodsSold)}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Total Sales Discounts</span>
            <span class="summary-value">${money(totalSalesDiscounts)}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Average Sale Amount</span>
            <span class="summary-value">${money(averageSaleAmount)}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Total Inventory Value</span>
            <span class="summary-value">${money(totalInventoryValue)}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Active Customers</span>
            <span class="summary-value">${numberValue(activeCustomers)} of ${numberValue(totalCustomers)}</span>
          </div>
        </div>
      `;
      document.getElementById(containerId).innerHTML = html;
    }

    async function generateProfitLoss() {
      const startDate = document.getElementById('pl-start').value;
      const endDate = document.getElementById('pl-end').value;

      if (!startDate || !endDate) {
        showError('profitloss-content', 'Please select both dates');
        return;
      }

      try {
        const response = await api.getProfitLossReport(startDate, endDate);
        displayFinancialReport(response.data, 'profitloss-content', startDate, endDate, 'Profit & Loss Statement');
      } catch (e) {
        showError('profitloss-content', backendError(e, 'Failed to generate profit and loss report'));
      }
    }

    async function generateMonthlySales() {
      const year = document.getElementById('ms-year').value;

      if (!year) {
        showError('monthlysales-content', 'Please select a year');
        return;
      }

      try {
        const response = await api.getMonthlySalesReport(year);
        const rows = asArray(response.data).map(m => {
          const monthNo = numberValue(getValue(m, 'month', 'Month'));
          const yearVal = getValue(m, 'year', 'Year') || year;
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          return `
            <tr>
              <td>${months[monthNo - 1] || 'Month ' + monthNo} ${yearVal}</td>
              <td>${numberValue(getValue(m, 'salesCount', 'SalesCount'))}</td>
              <td>${money(getValue(m, 'totalRevenue', 'TotalRevenue'))}</td>
              <td>${money(getValue(m, 'averageOrderValue', 'AverageOrderValue'))}</td>
            </tr>`;
        }).join('');

        document.getElementById('monthlysales-content').innerHTML = rows
          ? `<table style="margin-top:16px">
              <thead><tr><th>Month</th><th>Orders</th><th>Revenue</th><th>Avg Order</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>`
          : `<div class="empty-state" style="margin-top:16px;">No monthly sales data found for ${year}.</div>`;
      } catch (e) {
        showError('monthlysales-content', backendError(e, 'Failed to generate monthly sales report'));
      }
    }

    async function generateTopSelling() {
      const limit = document.getElementById('ts-limit').value || 10;

      try {
        const response = await api.getTopSellingProducts(limit);
        const rows = asArray(response.data).map((p, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${getValue(p, 'partName', 'PartName') || 'N/A'}</td>
            <td>${getValue(p, 'partNumber', 'PartNumber') || 'N/A'}</td>
            <td>${numberValue(getValue(p, 'totalQuantitySold', 'TotalQuantitySold'))}</td>
            <td>${money(getValue(p, 'totalRevenue', 'TotalRevenue'))}</td>
          </tr>`).join('');

        document.getElementById('topselling-content').innerHTML = rows
          ? `<table style="margin-top:16px">
              <thead><tr><th>#</th><th>Part Name</th><th>Part No.</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>`
          : `<div class="empty-state" style="margin-top:16px;">No top-selling data found.</div>`;
      } catch (e) {
        showError('topselling-content', backendError(e, 'Failed to generate top-selling report'));
      }
    }

    async function generateInventorySummary() {
      try {
        const response = await api.getInventorySummary();
        const d = response.data || {};
        const lowStockParts = asArray(getValue(d, 'lowStockParts', 'LowStockParts'));

        const lowRows = lowStockParts.map(p => {
          const stock = numberValue(getValue(p, 'currentStock', 'CurrentStock'));
          return `
            <tr>
              <td>${getValue(p, 'partName', 'PartName') || 'N/A'}</td>
              <td style="color:${stock === 0 ? '#EF4444' : '#F59E0B'}">${stock}</td>
              <td>${numberValue(getValue(p, 'reorderLevel', 'ReorderLevel'))}</td>
            </tr>`;
        }).join('');

        document.getElementById('inventory-content').innerHTML = `
          <div class="kpi-grid" style="margin-top:16px">
            <div class="kpi-card"><div class="kpi-label">Total Parts</div><div class="kpi-value">${numberValue(getValue(d, 'totalPartsInStock', 'TotalPartsInStock'))}</div></div>
            <div class="kpi-card"><div class="kpi-label">Inventory Value</div><div class="kpi-value">${money(getValue(d, 'totalInventoryValue', 'TotalInventoryValue'))}</div></div>
            <div class="kpi-card"><div class="kpi-label">Low Stock</div><div class="kpi-value" style="color:#F59E0B">${numberValue(getValue(d, 'lowStockCount', 'LowStockCount'))}</div></div>
            <div class="kpi-card"><div class="kpi-label">Out of Stock</div><div class="kpi-value" style="color:#EF4444">${numberValue(getValue(d, 'outOfStockCount', 'OutOfStockCount'))}</div></div>
          </div>
          ${lowRows ? `<table style="margin-top:16px">
            <thead><tr><th>Part Name</th><th>Current Stock</th><th>Reorder At</th></tr></thead>
            <tbody>${lowRows}</tbody>
          </table>` : '<div class="empty-state" style="margin-top:16px;">No low-stock parts found.</div>'}`;
      } catch (e) {
        showError('inventory-content', backendError(e, 'Failed to generate inventory summary'));
      }
    }

    function showError(containerId, message) {
      const html = `
        <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#FCA5A5;padding:16px;border-radius:8px;margin-top:16px;">
          ${message}
        </div>
      `;
      document.getElementById(containerId).innerHTML = html;
    }

    // Download Functions
    function downloadFinancialReport() {
      const startDate = document.getElementById('fin-start').value;
      const endDate = document.getElementById('fin-end').value;
      if (!startDate || !endDate) {
        alert('Please generate a report first');
        return;
      }

      const content = document.getElementById('financial-content').innerText;
      if (!content || content.includes('Failed') || content.includes('Please select')) {
        alert('Please generate a valid report first');
        return;
      }

      const csv = `Financial Report
Period: ${startDate} to ${endDate}

${content}`;
      downloadCSV(csv, `FinancialReport_${startDate}_to_${endDate}.csv`);
    }

    function downloadProfitLoss() {
      const startDate = document.getElementById('pl-start').value;
      const endDate = document.getElementById('pl-end').value;
      if (!startDate || !endDate) {
        alert('Please generate a report first');
        return;
      }

      const content = document.getElementById('profitloss-content').innerText;
      if (!content || content.includes('Failed') || content.includes('Please select')) {
        alert('Please generate a valid report first');
        return;
      }

      const csv = `Profit & Loss Statement
Period: ${startDate} to ${endDate}

${content}`;
      downloadCSV(csv, `ProfitLoss_${startDate}_to_${endDate}.csv`);
    }

    function downloadMonthlySales() {
      const year = document.getElementById('ms-year').value;
      if (!year) {
        alert('Please select a year');
        return;
      }

      const table = document.querySelector('#monthlysales-content table');
      if (!table) {
        alert('Please generate a report first');
        return;
      }

      let csv = `Monthly Sales Report - ${year}

`;
      const rows = table.querySelectorAll('tr');
      rows.forEach(row => {
        const cells = row.querySelectorAll('th, td');
        csv += Array.from(cells).map(cell => `"${cell.innerText}"`).join(',') + '\n';
      });

      downloadCSV(csv, `MonthlySales_${year}.csv`);
    }

    function downloadTopSelling() {
      const limit = document.getElementById('ts-limit').value || 10;
      const table = document.querySelector('#topselling-content table');
      if (!table) {
        alert('Please generate a report first');
        return;
      }

      let csv = `Top Selling Products (Top ${limit})

`;
      const rows = table.querySelectorAll('tr');
      rows.forEach(row => {
        const cells = row.querySelectorAll('th, td');
        csv += Array.from(cells).map(cell => `"${cell.innerText}"`).join(',') + '\n';
      });

      downloadCSV(csv, `TopSelling_${limit}.csv`);
    }

    function downloadInventory() {
      const content = document.getElementById('inventory-content').innerText;
      if (!content || content.includes('Failed')) {
        alert('Please generate a report first');
        return;
      }

      const csv = `Inventory Summary

${content}`;
      downloadCSV(csv, `InventorySummary_${new Date().toISOString().split('T')[0]}.csv`);
    }

    function downloadCSV(csvContent, filename) {
      try {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        saveAs(blob, filename);
      } catch (error) {
        console.error('Download error:', error);
        const link = document.createElement('a');
        link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
        link.download = filename;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }
  </script>
</body>
</html>
