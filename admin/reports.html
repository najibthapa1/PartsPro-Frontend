<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartsPro — Reports</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <style>
    :root {
      --pp-amber: #F59E0B;
      --pp-navy: #0B1121;
      --pp-navy2: #0F172A;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--pp-navy);
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* NAVIGATION BAR */
    .admin-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(11, 17, 33, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1E293B;
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 1000;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      margin-right: auto;
    }

    .nav-brand-dot {
      width: 8px; height: 8px;
      background: var(--pp-amber);
      border-radius: 1px;
    }

    .nav-brand-text {
      font-size: 14px;
      font-weight: 600;
      color: #E2E8F0;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 32px;
      flex: 1;
      justify-content: center;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: #64748B;
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    .nav-link:hover { color: #E2E8F0; }

    .nav-link.active {
      color: #E2E8F0;
      border-bottom-color: var(--pp-amber);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .nav-avatar {
      width: 32px; height: 32px;
      background: #0F172A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--pp-amber);
    }

    .nav-user-info { display: flex; flex-direction: column; font-size: 11px; }
    .nav-user-name { color: #E2E8F0; font-weight: 600; }
    .nav-user-role { color: #64748B; }

    .nav-logout {
      background: none; border: none;
      color: #64748B; cursor: pointer;
      font-size: 16px; padding: 4px;
      transition: color 0.3s;
    }
    .nav-logout:hover { color: #FF6B6B; }

    /* PAGE */
    .admin-page {
      margin-top: 64px;
      padding: 32px;
      min-height: calc(100vh - 64px);
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* HEADER */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
    }

    .header-left h1 {
      font-size: 32px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -1px;
      margin: 0 0 4px 0;
    }

    .header-left p {
      font-size: 14px;
      color: #64748B;
      margin: 0;
    }

    /* TABS */
    .tab-container {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #1E293B;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #64748B;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #E2E8F0;
    }

    .tab-btn.active {
      color: #E2E8F0;
      border-bottom-color: var(--pp-amber);
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      white-space: nowrap;
    }

    input[type="date"],
    input[type="number"],
    select {
      background: #0F172A;
      border: 1px solid #1E293B;
      color: #E2E8F0;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: all 0.3s;
    }

    input[type="date"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--pp-amber);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
    }

    .btn-action {
      background: var(--pp-amber);
      border: 1px solid var(--pp-amber);
      color: #0B1121;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-action:hover {
      background: #D97706;
      border-color: #D97706;
    }

    .btn-action.secondary {
      background: transparent;
      border-color: #1E293B;
      color: #E2E8F0;
    }

    .btn-action.secondary:hover {
      border-color: #475569;
      background: rgba(71, 85, 105, 0.1);
    }

    /* CONTENT */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    .tab-content.active {
      display: block;
    }

    /* KPI GRID */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 20px;
    }

    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748B;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    .kpi-helper {
      font-size: 11px;
      color: #64748B;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      overflow: hidden;
    }

    thead {
      background: #1A2332;
      border-bottom: 1px solid #1E293B;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #1E293B;
      font-size: 13px;
    }

    tbody tr:hover {
      background: #1A2332;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tfoot tr {
      background: #1A2332;
      font-weight: 600;
    }

    /* SUMMARY BOX */
    .summary-box {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 20px;
      margin-top: 24px;
    }

    .summary-box h3 {
      font-size: 14px;
      font-weight: 600;
      color: #E2E8F0;
      margin: 0 0 16px 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1E293B;
      font-size: 13px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #94A3B8;
    }

    .summary-value {
      font-weight: 600;
      color: #F59E0B;
      font-family: 'Monaco', monospace;
    }

    /* NO DATA */
    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #64748B;
      font-size: 14px;
    }

    /* EMPTY STATE */
    .empty-state {
      background: #0F172A;
      border: 1px dashed #1E293B;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      color: #64748B;
    }

    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .tab-container { flex-wrap: wrap; }
    }

    @media (max-width: 768px) {
      .admin-page { padding: 16px; }
      .admin-nav { padding: 0 16px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .nav-center { display: none; }
      .controls { flex-direction: column; align-items: stretch; }
      .control-group { flex-direction: column; }
      table { font-size: 12px; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="admin-nav">
    <div class="nav-left">
      <div class="nav-brand-dot"></div>
      <a href="../index.html" class="nav-brand-text">Parts Pro</a>
    </div>

    <div class="nav-center">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="inventory.html" class="nav-link">Inventory</a>
      <a href="vendors.html" class="nav-link">Vendors</a>
      <a href="staff.html" class="nav-link">Staff</a>
      <a href="purchase.html" class="nav-link">Purchases</a>
      <a href="reports.html" class="nav-link active">Reports</a>
    </div>

    <div class="nav-right">
      <div class="nav-avatar" id="nav-avatar">AD</div>
      <div class="nav-user-info">
        <div class="nav-user-name" id="nav-user-name">Admin</div>
        <div class="nav-user-role">Administrator</div>
      </div>
      <button class="nav-logout" id="logout-btn" title="Logout">⤴</button>
    </div>
  </nav>

  <!-- PAGE -->
  <div class="admin-page">
    <div class="admin-container">

      <!-- HEADER -->
      <div class="page-header">
        <div class="header-left">
          <h1>📊 Reports</h1>
          <p>Financial analytics and business insights</p>
        </div>
      </div>

      <!-- TABS -->
      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('financial')">Financial Report</button>
        <button class="tab-btn" onclick="switchTab('profitloss')">P&L Statement</button>
        <button class="tab-btn" onclick="switchTab('monthlysales')">Monthly Sales</button>
        <button class="tab-btn" onclick="switchTab('topselling')">Top Selling</button>
        <button class="tab-btn" onclick="switchTab('inventory')">Inventory</button>
      </div>

      <!-- FINANCIAL REPORT TAB -->
      <div id="financial" class="tab-content active">
        <div class="controls">
          <div class="control-group">
            <label for="fin-start">Start Date:</label>
            <input type="date" id="fin-start">
          </div>
          <div class="control-group">
            <label for="fin-end">End Date:</label>
            <input type="date" id="fin-end">
          </div>
          <button class="btn-action" onclick="generateFinancialReport()">Generate Report</button>
        </div>
        <div id="financial-content"></div>
      </div>

      <!-- P&L STATEMENT TAB -->
      <div id="profitloss" class="tab-content">
        <div class="controls">
          <div class="control-group">
            <label for="pl-start">Start Date:</label>
            <input type="date" id="pl-start">
          </div>
          <div class="control-group">
            <label for="pl-end">End Date:</label>
            <input type="date" id="pl-end">
          </div>
          <button class="btn-action" onclick="generateProfitLoss()">Generate P&L</button>
        </div>
        <div id="profitloss-content"></div>
      </div>

      <!-- MONTHLY SALES TAB -->
      <div id="monthlysales" class="tab-content">
        <div class="controls">
          <div class="control-group">
            <label for="ms-year">Year:</label>
            <input type="number" id="ms-year" min="2000" max="2099">
          </div>
          <button class="btn-action" onclick="generateMonthlySales()">Generate Report</button>
        </div>
        <div id="monthlysales-content"></div>
      </div>

      <!-- TOP SELLING TAB -->
      <div id="topselling" class="tab-content">
        <div class="controls">
          <div class="control-group">
            <label for="ts-limit">Top:</label>
            <input type="number" id="ts-limit" value="10" min="1" max="100">
          </div>
          <button class="btn-action" onclick="generateTopSelling()">Generate Report</button>
        </div>
        <div id="topselling-content"></div>
      </div>

      <!-- INVENTORY TAB -->
      <div id="inventory" class="tab-content">
        <div class="controls">
          <button class="btn-action" onclick="generateInventorySummary()">📦 Refresh Inventory</button>
        </div>
        <div id="inventory-content"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../shared/axios-config.js"></script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/role-guard.js"></script>
  <script src="../shared/auth-handler.js"></script>

  <script>
    RoleGuard.requireRole('Admin');

    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('userFullName') || 'Admin';
      const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('nav-avatar').textContent = initials;
      document.getElementById('nav-user-name').textContent = name;

      document.getElementById('logout-btn').addEventListener('click', () => {
        AuthHandler.logout();
      });

      initializeDateInputs();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function initializeDateInputs() {
      const endDate = new Date();
      const startDate = new Date(endDate.getTime() - (30 * 24 * 60 * 60 * 1000));

      document.getElementById('fin-start').valueAsDate = startDate;
      document.getElementById('fin-end').valueAsDate = endDate;
      document.getElementById('pl-start').valueAsDate = startDate;
      document.getElementById('pl-end').valueAsDate = endDate;
      document.getElementById('ms-year').value = new Date().getFullYear();
    }

    async function generateFinancialReport() {
      const startDate = document.getElementById('fin-start').value;
      const endDate = document.getElementById('fin-end').value;

      if (!startDate || !endDate) {
        showError('financial-content', 'Please select both dates');
        return;
      }

      try {
        const response = await api.get('/report/financial', { params: { startDate, endDate } });
        displayFinancialReport(response.data);
      } catch (e) {
        showError('financial-content', 'Failed to generate report');
      }
    }

    function displayFinancialReport(data) {
      const html = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Total Sales Revenue</div>
            <div class="kpi-value">Rs.${data.totalSalesRevenue?.toLocaleString() || '0'}</div>
            <div class="kpi-helper">${data.totalSalesCount || 0} transactions</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Total Purchase Cost</div>
            <div class="kpi-value">Rs.${data.totalPurchaseCost?.toLocaleString() || '0'}</div>
            <div class="kpi-helper">${data.totalPurchasesCount || 0} purchases</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Gross Profit</div>
            <div class="kpi-value">Rs.${data.grossProfit?.toLocaleString() || '0'}</div>
            <div class="kpi-helper">${data.grossProfitMargin?.toFixed(2) || '0'}% margin</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Net Profit</div>
            <div class="kpi-value">Rs.${data.netProfit?.toLocaleString() || '0'}</div>
            <div class="kpi-helper">After adjustments</div>
          </div>
        </div>

        <div class="summary-box">
          <h3>Financial Summary</h3>
          <div class="summary-row">
            <span class="summary-label">Report Period</span>
            <span class="summary-value">${startDate} to ${endDate}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Average Sale Amount</span>
            <span class="summary-value">Rs.${data.averageSaleAmount?.toLocaleString() || '0'}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Total Inventory Value</span>
            <span class="summary-value">Rs.${data.totalInventoryValue?.toLocaleString() || '0'}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Active Customers</span>
            <span class="summary-value">${data.activeCustomers || 0} of ${data.totalCustomers || 0}</span>
          </div>
        </div>
      `;
      document.getElementById('financial-content').innerHTML = html;
    }

    function generateProfitLoss() {
      const html = `
        <div class="empty-state">
          📊 Profit & Loss statement will be generated from API
        </div>
      `;
      document.getElementById('profitloss-content').innerHTML = html;
    }

    function generateMonthlySales() {
      const html = `
        <div class="empty-state">
          📅 Monthly sales report will be generated from API
        </div>
      `;
      document.getElementById('monthlysales-content').innerHTML = html;
    }

    function generateTopSelling() {
      const html = `
        <div class="empty-state">
          🏆 Top selling parts report will be generated from API
        </div>
      `;
      document.getElementById('topselling-content').innerHTML = html;
    }

    function generateInventorySummary() {
      const html = `
        <div class="empty-state">
          📦 Inventory summary will be generated from API
        </div>
      `;
      document.getElementById('inventory-content').innerHTML = html;
    }

    function showError(containerId, message) {
      const html = `
        <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#FCA5A5;padding:16px;border-radius:8px;margin-top:16px;">
          ❌ ${message}
        </div>
      `;
      document.getElementById(containerId).innerHTML = html;
    }
  </script>
</body>
</html>
