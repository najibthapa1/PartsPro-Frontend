<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartsPro — Invoices</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <style>
    :root { --pp-amber: #F59E0B; --pp-charcoal: #1F2937; --pp-charcoal2: #374151; }
    * { box-sizing: border-box; }
    body { background: var(--pp-charcoal); color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; }

    .staff-nav { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(31,41,55,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #4B5563; display: flex; align-items: center; padding: 0 32px; z-index: 1000; }
    .nav-left { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-right: auto; }
    .nav-brand-dot { width: 8px; height: 8px; background: var(--pp-amber); border-radius: 1px; }
    .nav-brand-text { font-size: 14px; font-weight: 600; color: #F3F4F6; letter-spacing: -0.5px; text-decoration: none; }
    .nav-center { display: flex; align-items: center; gap: 32px; flex: 1; justify-content: center; }
    .nav-link { font-size: 13px; font-weight: 500; color: #6B7280; text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; transition: all 0.3s; }
    .nav-link:hover { color: #F3F4F6; }
    .nav-link.active { color: #F3F4F6; border-bottom-color: var(--pp-amber); }
    .nav-right { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; margin-left: auto; }
    .nav-avatar { width: 32px; height: 32px; background: #374151; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--pp-amber); }
    .nav-user-info { display: flex; flex-direction: column; font-size: 11px; }
    .nav-user-name { color: #F3F4F6; font-weight: 600; }
    .nav-user-role { color: #6B7280; }
    .nav-logout { background: none; border: none; color: #6B7280; cursor: pointer; font-size: 16px; padding: 4px; transition: color 0.3s; }
    .nav-logout:hover { color: #FF6B6B; }

    .staff-page { margin-top: 64px; padding: 32px; min-height: calc(100vh - 64px); }
    .staff-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .page-header { display: flex; justify-content: space-between; align-items: flex-end; }
    .page-header h1 { font-size: 28px; font-weight: 700; color: #F3F4F6; letter-spacing: -1px; margin: 0 0 4px; }
    .page-header p { font-size: 14px; color: #6B7280; margin: 0; }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: #374151;
      border: 1px solid #4B5563;
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label { font-size: 11px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; }
    .filter-input {
      background: #1F2937;
      border: 1px solid #4B5563;
      color: #F3F4F6;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-input:focus { border-color: var(--pp-amber); }
    .filter-input::placeholder { color: #6B7280; }
    .btn-filter {
      background: #4B5563;
      border: none;
      color: #F3F4F6;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      height: 36px;
    }
    .btn-filter:hover { background: #6B7280; }
    .btn-filter.active { background: var(--pp-amber); color: #1F2937; }

    /* ── INVOICE TABLE ── */
    .table-card {
      background: #374151;
      border: 1px solid #4B5563;
      border-radius: 8px;
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #1F2937; }
    th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    td { padding: 13px 16px; border-bottom: 1px solid #4B5563; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #3f4a5a; }

    .inv-id { font-family: 'Monaco', monospace; font-size: 12px; color: var(--pp-amber); }
    .inv-customer { font-weight: 600; color: #F3F4F6; }
    .inv-amount { font-family: 'Monaco', monospace; font-weight: 600; color: #F3F4F6; }
    .inv-discount { font-size: 11px; color: #10B981; }
    .inv-date { color: #9CA3AF; font-size: 12px; }
    .badge-loyalty { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.3); border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 600; }
    .badge-email-sent { background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); border-radius: 4px; padding: 2px 6px; font-size: 10px; }
    .badge-email-pending { background: rgba(107,114,128,0.15); color: #9CA3AF; border: 1px solid rgba(107,114,128,0.3); border-radius: 4px; padding: 2px 6px; font-size: 10px; }

    /* ── ACTION BUTTONS ── */
    .action-group { display: flex; gap: 6px; }
    .btn-icon {
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-view { background: transparent; border-color: #4B5563; color: #D1D5DB; }
    .btn-view:hover { border-color: var(--pp-amber); color: var(--pp-amber); }
    .btn-email { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #60A5FA; }
    .btn-email:hover { background: rgba(59,130,246,0.3); }
    .btn-email:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-email.sending { opacity: 0.7; cursor: wait; }

    /* ── DETAIL MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1F2937;
      border: 1px solid #4B5563;
      border-radius: 10px;
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid #374151;
      position: sticky; top: 0; background: #1F2937; z-index: 1;
    }
    .modal-header h2 { font-size: 16px; font-weight: 600; color: #F3F4F6; margin: 0; }
    .modal-close { background: none; border: none; color: #6B7280; font-size: 20px; cursor: pointer; }
    .modal-close:hover { color: #F3F4F6; }
    .modal-body { 
      padding: 20px 22px; 
      min-height: 200px;
      color: #F3F4F6;
    }

    .inv-summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .inv-summary-box { background: #374151; border: 1px solid #4B5563; border-radius: 6px; padding: 12px; text-align: center; }
    .inv-summary-val { font-size: 16px; font-weight: 700; color: var(--pp-amber); font-family: 'Monaco', monospace; }
    .inv-summary-lbl { font-size: 10px; color: #6B7280; margin-top: 2px; }

    .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items-table th { padding: 8px 10px; background: #374151; color: #FFFFFF; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; text-align: left; }
    .items-table td { padding: 10px; border-bottom: 1px solid #374151; color: #FFFFFF; }
    .items-table tr:last-child td { border-bottom: none; }

    .detail-row { 
      display: flex; 
      justify-content: space-between; 
      padding: 10px 0; 
      font-size: 13px; 
      border-bottom: 1px solid rgba(75,85,99,0.3);
      align-items: center;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #9CA3AF; font-weight: 500; }
    .detail-value { color: #FFFFFF; font-weight: 600; text-align: right; }
    .section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #6B7280; margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #374151; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #374151; border: 1px solid #4B5563;
      border-radius: 8px; padding: 12px 18px;
      font-size: 13px; font-weight: 500;
      z-index: 9999; transform: translateY(80px);
      opacity: 0; transition: all 0.3s;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(16,185,129,0.5); color: #10B981; }
    .toast.error { border-color: rgba(239,68,68,0.5); color: #FCA5A5; }

    /* ── EMPTY ── */
    .state-box { background: #374151; border: 1px solid #4B5563; border-radius: 8px; padding: 48px 24px; text-align: center; }
    .spinner { width: 28px; height: 28px; border: 3px solid #4B5563; border-top-color: var(--pp-amber); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1024px) { .nav-center { display: none; } }
    @media (max-width: 768px) { .staff-page { padding: 16px; } .staff-nav { padding: 0 16px; } .filter-bar { flex-direction: column; } .inv-summary-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

  <nav class="staff-nav">
    <div class="nav-left">
      <div class="nav-brand-dot"></div>
      <a href="../index.html" class="nav-brand-text">Parts Pro</a>
    </div>
    <div class="nav-center">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="sales.html" class="nav-link">New Sale</a>
      <a href="customer.html" class="nav-link">Customers</a>
      <a href="search.html" class="nav-link">Search</a>
      <a href="invoices.html" class="nav-link active">Invoices</a>
    </div>
    <div class="nav-right">
      <div class="nav-avatar" id="nav-avatar">ST</div>
      <div class="nav-user-info">
        <div class="nav-user-name" id="nav-user-name">Staff</div>
        <div class="nav-user-role">Staff Member</div>
      </div>
      <button class="nav-logout" id="logout-btn">⤴</button>
    </div>
  </nav>

  <div class="staff-page">
    <div class="staff-container">

      <div class="page-header">
        <div>
          <h1>📋 Sales Invoices</h1>
          <p>View, manage, and email customer invoices — F7 &amp; F11</p>
        </div>
        <a href="sales.html" style="background:var(--pp-amber);border:none;color:#1F2937;padding:9px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none">+ New Sale</a>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <label>Search customer</label>
          <input type="text" class="filter-input" id="filter-customer" placeholder="Customer name..." style="width:200px">
        </div>
        <div class="filter-group">
          <label>From date</label>
          <input type="date" class="filter-input" id="filter-from">
        </div>
        <div class="filter-group">
          <label>To date</label>
          <input type="date" class="filter-input" id="filter-to">
        </div>
        <button class="btn-filter active" onclick="applyFilter()">Apply Filter</button>
        <button class="btn-filter" onclick="clearFilter()">Clear</button>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Invoice #</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Discount</th>
                <th>Final</th>
                <th>Date</th>
                <th>Email</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="invoices-tbody">
              <tr><td colspan="9" style="text-align:center;padding:40px"><div class="spinner" style="margin:0 auto 10px"></div><span style="color:#6B7280;font-size:13px"> </span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Invoice Detail Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title">Invoice Details</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../shared/axios-config.js"></script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/role-guard.js"></script>
  <script src="../shared/auth-handler.js"></script>

  <script>
    let allInvoices = [];
    let currentInvoiceId = null;

    RoleGuard.requireRole('Staff');

    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('userFullName') || 'Staff';
      const initials = name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      document.getElementById('nav-avatar').textContent = initials;
      document.getElementById('nav-user-name').textContent = name;
      document.getElementById('logout-btn').addEventListener('click', () => AuthHandler.logout());

      // Default date range: last 30 days
      const today = new Date();
      const ago30 = new Date(today - 30*24*60*60*1000);
      document.getElementById('filter-to').value = today.toISOString().slice(0,10);
      document.getElementById('filter-from').value = ago30.toISOString().slice(0,10);

      loadInvoices();
    });

    async function loadInvoices() {
      try {
        // GET /api/sale - Get all sales
        const res = await api.getAllSales();
        allInvoices = res.data || [];
        renderTable(allInvoices);
      } catch (e) {
        document.getElementById('invoices-tbody').innerHTML =
          `<tr><td colspan="9" style="text-align:center;padding:40px;color:#FCA5A5">⚠️ Failed to load invoices. ${e.response?.data?.title || ''}</td></tr>`;
      }
    }

    function renderTable(invoices) {
      const tbody = document.getElementById('invoices-tbody');
      if (invoices.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:#6B7280">No invoices found for the selected filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = invoices.map(inv => {
        const itemCount = inv.items?.length ?? 0;
        const hasDiscount = inv.loyaltyDiscountApplied;

        return `
          <tr>
            <td><span class="inv-id">#${inv.id}</span></td>
            <td>
              <div class="inv-customer">Customer #${inv.customerId}</div>
            </td>
            <td>${itemCount} item${itemCount !== 1 ? 's' : ''}</td>
            <td class="inv-amount">Rs. ${inv.totalAmount?.toLocaleString()}</td>
            <td>
              ${hasDiscount
                ? `<span class="inv-discount">-Rs. ${inv.discountAmount?.toLocaleString()}</span> <span class="badge-loyalty">10% off</span>`
                : '<span style="color:#4B5563">—</span>'}
            </td>
            <td class="inv-amount" style="color:var(--pp-amber)">Rs. ${inv.finalAmount?.toLocaleString()}</td>
            <td class="inv-date">${formatDate(inv.createdAt)}</td>
            <td>
              <button class="btn-icon btn-email" onclick="sendInvoiceEmail(${inv.id})" title="Send invoice via email" style="background:#10B981;color:white;padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px">📧 Email</button>
            </td>
            <td>
              <div class="action-group">
                <button class="btn-icon btn-view" onclick="openModal(${inv.id})">View</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    function applyFilter() {
      const customerQ = document.getElementById('filter-customer').value.toLowerCase().trim();
      const from = document.getElementById('filter-from').value;
      const to = document.getElementById('filter-to').value;

      let filtered = [...allInvoices];

      if (customerQ) {
        filtered = filtered.filter(i => String(i.customerId).includes(customerQ));
      }
      if (from) {
        filtered = filtered.filter(i => new Date(i.createdAt) >= new Date(from));
      }
      if (to) {
        const toDate = new Date(to);
        toDate.setHours(23,59,59);
        filtered = filtered.filter(i => new Date(i.createdAt) <= toDate);
      }
      renderTable(filtered);
    }

    function clearFilter() {
      document.getElementById('filter-customer').value = '';
      document.getElementById('filter-from').value = '';
      document.getElementById('filter-to').value = '';
      renderTable(allInvoices);
    }

    async function openModal(saleId) {
      currentInvoiceId = saleId;
      document.getElementById('modal-overlay').classList.add('open');
      document.getElementById('modal-title').textContent = `Invoice #${saleId}`;
      document.getElementById('modal-body').innerHTML = `<div class="spinner" style="margin:24px auto"></div>`;

      try {
        // GET /api/sale/{id} - Get sale details
        const res = await api.getSale(saleId);
        console.log('Modal data:', res.data); // DEBUG
        renderModal(res.data);
      } catch(e) {
        console.error('Modal error:', e); // DEBUG
        document.getElementById('modal-body').innerHTML = `<p style="color:#FCA5A5">Failed to load invoice details: ${e.message}</p>`;
      }
    }

    function renderModal(inv) {
      const rows = (inv.items || []).map(item => `
        <tr>
          <td>${item.partId}</td>
          <td>${item.partName || 'N/A'}</td>
          <td style="text-align:center">${item.quantity}</td>
          <td>Rs. ${item.unitPrice?.toLocaleString()}</td>
          <td style="color:var(--pp-amber);font-weight:600">Rs. ${(item.quantity * item.unitPrice)?.toLocaleString()}</td>
        </tr>`).join('');

      const modalContent = `
        <div class="detail-row"><span class="detail-label">Customer ID</span><span class="detail-value">${inv.customerId}</span></div>
        <div class="detail-row"><span class="detail-label">Customer Name</span><span class="detail-value">${inv.customerName || 'N/A'}</span></div>
        <div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">${formatDate(inv.createdAt)}</span></div>

        <div class="inv-summary-grid" style="margin-top:16px">
          <div class="inv-summary-box"><div class="inv-summary-val">Rs. ${inv.totalAmount?.toLocaleString()}</div><div class="inv-summary-lbl">Subtotal</div></div>
          <div class="inv-summary-box"><div class="inv-summary-val" style="color:${inv.discountAmount > 0 ? '#10B981' : '#6B7280'}">-Rs. ${(inv.discountAmount || 0).toLocaleString()}</div><div class="inv-summary-lbl">Discount ${inv.loyaltyDiscountApplied ? '(Loyalty 10%)' : ''}</div></div>
          <div class="inv-summary-box"><div class="inv-summary-val">Rs. ${inv.finalAmount?.toLocaleString()}</div><div class="inv-summary-lbl">Final Total</div></div>
        </div>

        <div class="section-title">Line Items (${(inv.items || []).length})</div>
        <table class="items-table">
          <thead><tr><th>Part ID</th><th>Part Name</th><th style="text-align:center">Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="5" style="color:#6B7280;text-align:center">No items</td></tr>'}</tbody>
        </table>

        <div style="display:flex;gap:8px;margin-top:20px;justify-content:flex-end">
          <button class="btn-icon btn-email" onclick="sendCurrentInvoiceEmail()" title="Send this invoice via email" style="background:#10B981;color:white;padding:8px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500">📧 Send Email</button>
          <button class="btn-icon btn-view" onclick="closeModal()">Close</button>
        </div>`;
      
      document.getElementById('modal-body').innerHTML = modalContent;
      console.log('Modal rendered with', (inv.items || []).length, 'items'); // DEBUG
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('modal-overlay')) {
        document.getElementById('modal-overlay').classList.remove('open');
        currentInvoiceId = null;
      }
    }

    async function sendInvoiceEmail(saleId) {
      if (!confirm('Send this invoice via email to the customer?')) return;
      
      try {
        await api.sendSaleInvoiceEmail(saleId);
        showToast('success', `Invoice #${saleId} email sent successfully!`);
      } catch (e) {
        showToast('error', `Failed to send email: ${e.response?.data?.message || e.message}`);
      }
    }

    async function sendCurrentInvoiceEmail() {
      if (!currentInvoiceId) {
        showToast('error', 'No invoice selected');
        return;
      }
      await sendInvoiceEmail(currentInvoiceId);
    }

    function showToast(type, msg) {
      const t = document.getElementById('toast');
      t.textContent = (type === 'success' ? '✓ ' : '✕ ') + msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    function formatDate(d) {
      if (!d) return 'N/A';
      return new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
